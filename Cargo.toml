[package]
name = "clickforge"
version = "0.6.0"
edition = "2021"
description = "Linux mouse click multiplier with optional GTK GUI, configurable buttons, independent profiles and Wayland overlay"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
evdev = "0.13.2"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
gtk = { package = "gtk4", version = "0.10" }
gtk4-layer-shell = "0.7.1"
